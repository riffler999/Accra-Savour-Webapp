<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accra Savour | Authentic Ghanaian Cuisine</title>
  <style>
    :root {
      --cream: #F7F4EF; --cream-dark: #EDE5D9; --charcoal: #1C1B19;
      --charcoal-soft: #3A3733; --terracotta: #B85042; --terracotta-dark: #8E3E32;
      --terracotta-light: #D98A7A; --white: #FFFFFF; --ink: #1C1B19;
      --muted: #6E695F; --line: #D9D4C7; --success: #2E7D32; --error: #B85042;
      --radius: 10px; --radius-sm: 6px;
      --shadow: 0 20px 40px -12px rgba(28, 27, 25, 0.08);
      --shadow-md: 0 8px 24px -6px rgba(28, 27, 25, 0.06);
      --transition: 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); line-height: 1.6; overflow-x: hidden; }
    h1, h2, h3, h4, .logo, .section-title { font-family: 'Playfair Display', serif; font-weight: 700; line-height: 1.15; }
    a { color: inherit; text-decoration: none; } ul, ol { list-style: none; } img { display: block; max-width: 100%; height: auto; }
    button { font-family: inherit; background: none; border: none; cursor: pointer; font-size: inherit; }
    input, select, textarea { font-family: inherit; font-size: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-wrap">
      <a href="#home" class="logo">Accra<span style="background:var(--terracotta);color:#fff;padding:0.15rem 0.45rem;border-radius:3px;font-weight:700">Savour</span></a>
      <nav class="main-nav" id="main-nav"><a href="#home">Home</a><a href="#menu">Menu</a><a href="#cart">Cart</a><a href="#contact">Contact</a></nav>
      <div class="header-actions"><a href="#cart" class="cart-btn" aria-label="Shopping cart"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4" cy="18" r="3"></circle><circle cx="20" cy="18" r="3"></circle><path d="M2 6h20"></path><path d="M6 10l4 4l-2 8l4-4Z"></path></svg><span class="cart-badge">0</span></a><button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu"><div class="line"></div></button></div>
    </div>
  </header>
